# GitHub Pages 自动部署
# 推送到 main 分支即自动构建并发布，无需手动上传 dist
name: Deploy to GitHub Pages

on:
  push:
    # deploy-trigger 为临时触发分支（用于手动触发一次构建），部署稳定后会移除
    branches: [main, deploy-trigger]
  # 允许在 Actions 页面手动点「Run workflow」触发
  workflow_dispatch:

# Pages 部署必需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署任务，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        # GITHUB_REPOSITORY 形如 "encod/my-blog"，取后半段作为子路径
        # 这样仓库名改了也不用回来改配置
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          npm run build -- --base "/$REPO_NAME/"

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        # 注意：不能在 action 里用 enablement: true 自动开通 Pages。
        # 开通 Pages 属于仓库管理员操作，Actions 内置的 GITHUB_TOKEN 没有该权限，
        # 会报 "Resource not accessible by integration"。
        # 因此仓库首次部署需在网页端打开一次：
        # Settings → Pages → Build and deployment → Source 选 GitHub Actions。
        # 开通一次后，后续每次 git push 全自动，无需再操作。

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
